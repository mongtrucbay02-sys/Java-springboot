<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết khóa học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/courses}">Quản lý khóa học</a>
  </div>
</nav>

<div class="container">
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <h3 th:text="${course.name}"></h3>
          <p class="text-muted mb-2" th:text="'Loại: ' + ${course.category.name}"></p>
          <span class="badge text-bg-secondary" th:text="${course.duration} + ' giờ'"></span>
          <span class="badge"
                th:classappend="${course.durationType == 'Ngắn hạn'} ? 'text-bg-info' : 'text-bg-warning'"
                th:text="${course.durationType}"></span>
          <span class="badge"
                th:classappend="${course.active} ? 'text-bg-success' : 'text-bg-danger'"
                th:text="${course.statusText}"></span>
        </div>
        <div class="text-end">
          <div class="fs-4 fw-bold text-primary"
               th:text="${#numbers.formatDecimal(course.tuitionFee, 0, 'POINT', 0, 'COMMA')} + ' đ'"></div>
          <a class="btn btn-sm btn-outline-secondary mt-2" th:href="@{/courses/{id}/edit(id=${course.id})}">Sửa</a>
        </div>
      </div>
      <hr>
      <p class="mb-0" th:text="${course.description}"></p>
    </div>
  </div>

  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

  <h5>Hình ảnh khóa học</h5>
  <div class="alert alert-secondary" th:if="${#lists.isEmpty(course.images)}">Khóa học chưa có ảnh.</div>

  <div class="row g-3 mb-4">
    <div class="col-md-4 col-sm-6" th:each="img : ${course.images}">
      <div class="card shadow-sm h-100" th:classappend="${img.thumbnail} ? 'border-warning border-2'">
        <img th:src="${img.imageUrl}" class="card-img-top" style="height:180px;object-fit:cover" alt="Ảnh khóa học">
        <div class="card-body text-center">
          <span class="badge text-bg-warning" th:if="${img.thumbnail}">★ Ảnh đại diện</span>
          <form th:unless="${img.thumbnail}" method="post"
                th:action="@{/courses/{id}/images/{iid}/thumbnail(id=${course.id}, iid=${img.id})}">
            <button class="btn btn-sm btn-outline-warning" type="submit">Đặt làm ảnh đại diện</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h6>Thêm ảnh bằng URL</h6>
      <form method="post" th:action="@{/courses/{id}/images(id=${course.id})}" class="d-flex gap-2">
        <input class="form-control" name="imageUrl" placeholder="https://...">
        <button class="btn btn-primary" type="submit">Thêm</button>
      </form>
    </div>
  </div>

  <a class="btn btn-outline-secondary mb-4" th:href="@{/courses}">&larr; Quay lại danh sách</a>
</div>
</body>
</html>
