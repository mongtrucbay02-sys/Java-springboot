<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khóa học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/courses}">Quản lý khóa học</a>
  </div>
</nav>

<div class="container" style="max-width:700px">
  <div class="card shadow-sm">
    <div class="card-header bg-white">
      <h4 class="mb-0" th:text="${course.id == null} ? 'Thêm khóa học' : 'Sửa khóa học'"></h4>
    </div>
    <div class="card-body">
      <form method="post" th:object="${course}"
            th:action="${course.id == null} ? @{/courses/create} : @{/courses/{id}/edit(id=${course.id})}">

        <div class="mb-3">
          <label class="form-label">Tên khóa học</label>
          <input class="form-control" th:field="*{name}" th:errorclass="is-invalid">
          <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Học phí (đ)</label>
            <input class="form-control" type="number" th:field="*{tuitionFee}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{tuitionFee}"></div>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Thời lượng (giờ)</label>
            <input class="form-control" type="number" th:field="*{duration}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{duration}"></div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Loại khóa học</label>
          <select class="form-select" th:field="*{category.id}" th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
            <option value="">-- Chọn loại --</option>
            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
          </select>
          <div class="invalid-feedback" th:errors="*{category}"></div>
        </div>

        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" th:field="*{active}">
          <label class="form-check-label" for="active">Đang tuyển sinh</label>
        </div>

        <div class="mb-3">
          <label class="form-label">Mô tả</label>
          <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
        </div>

        <button class="btn btn-primary" type="submit">Lưu</button>
        <a class="btn btn-outline-secondary" th:href="@{/courses}">Quay lại</a>
      </form>
    </div>
  </div>
</div>
</body>
</html>
