<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý khóa học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/courses}">Quản lý khóa học</a>
    <div>
      <a class="btn btn-outline-light btn-sm" th:href="@{/courses}">Khóa học</a>
      <a class="btn btn-outline-light btn-sm" th:href="@{/categories}">Loại khóa học</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Danh sách khóa học</h3>
    <a class="btn btn-success" th:href="@{/courses/create}">+ Thêm khóa học</a>
  </div>

  <!-- Bộ lọc -->
  <form method="get" th:action="@{/courses}" class="card card-body shadow-sm mb-3">
    <div class="row g-2">
      <div class="col-md-4">
        <input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm theo tên khóa học">
      </div>
      <div class="col-md-4">
        <select class="form-select" name="categoryId">
          <option value="">-- Tất cả loại --</option>
          <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                  th:selected="${c.id == categoryId}"></option>
        </select>
      </div>
      <div class="col-md-4">
        <select class="form-select" name="status">
          <option value="">-- Mọi trạng thái --</option>
          <option value="active" th:selected="${status == 'active'}">Đang tuyển sinh</option>
          <option value="inactive" th:selected="${status == 'inactive'}">Ngừng tuyển sinh</option>
        </select>
      </div>
      <div class="col-md-3">
        <input class="form-control" type="number" name="minFee" th:value="${minFee}" placeholder="Học phí tối thiểu">
      </div>
      <div class="col-md-3">
        <input class="form-control" type="number" name="maxFee" th:value="${maxFee}" placeholder="Học phí tối đa">
      </div>
      <div class="col-md-3">
        <select class="form-select" name="sort">
          <option value="">-- Sắp xếp --</option>
          <option value="fee_asc" th:selected="${sort == 'fee_asc'}">Học phí tăng dần</option>
          <option value="fee_desc" th:selected="${sort == 'fee_desc'}">Học phí giảm dần</option>
          <option value="duration_asc" th:selected="${sort == 'duration_asc'}">Thời lượng tăng dần</option>
        </select>
      </div>
      <div class="col-md-3 d-flex gap-2">
        <button class="btn btn-primary flex-fill" type="submit">Lọc</button>
        <a class="btn btn-outline-secondary" th:href="@{/courses}">Xóa lọc</a>
      </div>
    </div>
  </form>

  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
  <div class="alert alert-warning" th:if="${#lists.isEmpty(courses) and error == null}">
    Không tìm thấy khóa học nào.
  </div>

  <div class="card shadow-sm" th:unless="${#lists.isEmpty(courses)}">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Ảnh</th><th>Tên khóa học</th><th>Loại</th>
            <th class="text-end">Học phí</th><th>Thời lượng</th>
            <th>Phân loại</th><th>Trạng thái</th><th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="c : ${courses}">
            <td style="width:100px">
              <img th:if="${c.thumbnail != null}" th:src="${c.thumbnail.imageUrl}"
                   class="rounded" style="width:80px;height:55px;object-fit:cover">
              <span th:if="${c.thumbnail == null}" class="text-muted small">Chưa có ảnh</span>
            </td>
            <td class="fw-semibold" th:text="${c.name}"></td>
            <td th:text="${c.category.name}"></td>
            <td class="text-end" th:text="${#numbers.formatDecimal(c.tuitionFee, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
            <td th:text="${c.duration} + ' giờ'"></td>
            <td>
              <span class="badge"
                    th:classappend="${c.durationType == 'Ngắn hạn'} ? 'text-bg-info' : 'text-bg-warning'"
                    th:text="${c.durationType}"></span>
            </td>
            <td>
              <span class="badge"
                    th:classappend="${c.active} ? 'text-bg-success' : 'text-bg-danger'"
                    th:text="${c.statusText}"></span>
            </td>
            <td class="text-nowrap">
              <a class="btn btn-sm btn-outline-primary" th:href="@{/courses/{id}(id=${c.id})}">Chi tiết</a>
              <a class="btn btn-sm btn-outline-secondary" th:href="@{/courses/{id}/edit(id=${c.id})}">Sửa</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
