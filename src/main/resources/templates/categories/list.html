<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loại khóa học</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/courses}">Quản lý khóa học</a>
    <div>
      <a class="btn btn-outline-light btn-sm" th:href="@{/courses}">Khóa học</a>
      <a class="btn btn-outline-light btn-sm" th:href="@{/categories}">Loại khóa học</a>
    </div>
  </div>
</nav>

<div class="container">
  <h3 class="mb-3">Loại khóa học</h3>

  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
  <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

  <div class="card shadow-sm">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr><th>Tên loại</th><th>Mô tả</th><th>Số khóa học</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="c : ${categories}">
          <td class="fw-semibold" th:text="${c.name}"></td>
          <td th:text="${c.description}"></td>
          <td><span class="badge text-bg-primary" th:text="${#lists.size(c.courses)}"></span></td>
          <td class="text-end">
            <form method="post" th:action="@{/categories/{id}/delete(id=${c.id})}"
                  onsubmit="return confirm('Bạn chắc chắn muốn xóa loại này?');">
              <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
